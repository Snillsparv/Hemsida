<style>
  :root{
    --bg:#0c0c0d;--ink:#eae6dc;--mist:#b7b1a4;--hair:#3f3d37;--accent:#ffd166;--mini:1.15;
    --sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
    --serif:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
    line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .topp{position:absolute;top:1.4rem;left:1.4rem;z-index:5;font-family:var(--mono);
    font-size:calc(.66rem * var(--mini));letter-spacing:.24em;text-transform:uppercase;
    color:var(--mist);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:.2rem}
  .topp:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .wrap{max-width:46rem;margin:0 auto;padding:7rem 1.5rem 4rem}
  .huvud{text-align:center;margin-bottom:clamp(2.5rem,6vh,4rem)}
  .label{font-family:var(--mono);font-size:calc(.66rem * var(--mini));font-weight:400;
    letter-spacing:.44em;text-transform:uppercase;color:var(--mist);margin:0 0 1.8rem}
  h1{font-size:clamp(1.9rem,1.3rem + 3vw,3.1rem);font-weight:400;letter-spacing:.045em;

    font-size:clamp(.98rem,.9rem + .4vw,1.08rem);line-height:1.75}
  .avsnitt{margin:clamp(3.4rem,8vh,5rem) 0 0}
  .nr{font-family:var(--mono);font-size:calc(.66rem * var(--mini));letter-spacing:.44em;
    text-transform:uppercase;color:var(--mist);margin:0 0 1.1rem;text-align:center}
  .vram{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--hair)}
  .vram iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .bild{margin:clamp(3rem,7vh,4.5rem) 0 0}
  .bild img{width:100%;height:auto;display:block;border:1px solid var(--hair);background:#fff}
  figcaption{font-family:var(--mono);font-size:calc(.62rem * var(--mini));letter-spacing:.18em;
    text-transform:uppercase;color:var(--mist);text-align:center;margin-top:.9rem}
  .sifferrutor{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));
    gap:.3rem 1.6rem;font-family:var(--mono);font-size:calc(.74rem * var(--mini));line-height:1.75}
  .sifferrutor span{overflow-wrap:anywhere}
  .sifferrutor b{color:var(--accent);font-weight:600;margin-right:.6em}
  .lista{max-width:38rem;margin:0 auto;columns:2;column-gap:3rem;padding-left:1.4rem;
    font-size:clamp(.95rem,.9rem + .3vw,1.05rem);line-height:1.9}
  .lista li{break-inside:avoid}
  h2{font-weight:400;font-size:clamp(1.5rem,1.15rem + 2vw,2.2rem);letter-spacing:.04em;
    line-height:1.2;text-align:center;text-wrap:balance;margin:0 0 1.4rem}
  h3{font-weight:400;font-size:clamp(1.2rem,1rem + 1.2vw,1.6rem);letter-spacing:.03em;

  .fri{margin:2.6rem auto 0;text-align:center}
  .fri img{border:none;background:transparent;width:auto;max-width:min(62%,19rem);height:auto;display:inline-block}
  .tldr{border:1px solid var(--hair);padding:1.5rem 1.7rem;margin:2.4rem auto 0;max-width:38rem;text-align:left}
  .tldr ul{margin:.9rem 0 0;padding-left:1.2rem;line-height:1.8}
  .tldr li{margin-bottom:.5rem}
  .glosa{max-width:38rem;margin:0 auto .95rem;line-height:1.7;text-align:left}
  .glosa b{color:var(--accent);font-weight:600}
  .glosa .ov{color:var(--mist);font-style:italic}
  .slutlank{text-align:center;margin-top:clamp(3rem,7vh,4.5rem)}
  .slutlank a{font-family:var(--mono);font-size:calc(.7rem * var(--mini));letter-spacing:.24em;
    text-transform:uppercase;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:.2rem}
  .slutlank a:hover{border-bottom-color:var(--accent)}
