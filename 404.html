<script>
  /* gamla adresser med understigar (t.ex. /blogg/inlagg) skickas rätt direkt */
  (function () {
    var p = location.pathname.toLowerCase();
    var mal = null;
    if (p.indexOf('/blogg') === 0) mal = '/#nyhetsbrev';
    else if (p.indexOf('/forelas') === 0) mal = '/#kontakt';
    else if (p.indexOf('/kontakt') === 0) mal = '/#kontakt';
    else if (p.indexOf('/superminne') === 0 || p.indexOf('/minnestips') === 0) mal = '/#kurs';
    if (mal) location.replace(mal);
    else setTimeout(function () { location.href = '/'; }, 6000);
  })();
</script>
